name: yeman_zefen
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_tracking_transparency: ^2.0.7
  audio_session: ^0.2.4
  background_downloader: ^9.6.4
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  drift: ^2.35.2
  firebase_auth: ^6.1.0
  firebase_core: ^4.2.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sign_in_with_apple: ^8.2.0
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    # The bundled starter pack (manifest and clips), written by tool/fetch_starter_pack.dart.
    - assets/starter/
    - assets/starter/clips/
    # Sound effects (correct, wrong, time-out, countdown tick, game over).
    - assets/sfx/
  # Family names are the ones in docs/design/tokens.json (typography.family).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    # One variable font (weights 100-900); AppTextStyles picks the weight with fontVariations.
    - family: Noto Sans Ethiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf

