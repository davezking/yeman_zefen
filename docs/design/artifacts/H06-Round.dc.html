<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi-fi: round</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cap{font:600 12px/20px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#33433F}
.ph{position:relative;width:360px;height:780px;border-radius:40px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(43,33,24,.16);font-family:'Poppins','Noto Sans Ethiopic',sans-serif;color:#2B2118;font-size:15px;line-height:1.4}
.ph.am{font-family:'Noto Sans Ethiopic','Poppins',sans-serif;line-height:1.55}
.sun{background:radial-gradient(70% 55% at 50% 62%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#FFDF6E 0%,#FFC93C 55%,#FFB02E 100%)}
.sq{width:48px;height:48px;border-radius:16px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#2B2118;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:none}
.chip{min-height:34px;border-radius:12px;display:inline-flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12),inset 0 10px 12px rgba(255,255,255,.38)}
.ans{min-height:84px;border-radius:20px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:16px;font-weight:700;padding:8px 10px;text-align:center;color:#2B2118;background:linear-gradient(180deg,#FFFFFF 0%,#FBF4E8 100%);box-shadow:0 6px 0 #EDE3D2,0 12px 26px rgba(43,33,24,.10)}
.ans.ok{background:linear-gradient(180deg,#2A8A77 0%,#1D6658 100%);color:#FFFFFF;box-shadow:0 6px 0 #144A40,0 12px 28px rgba(35,120,106,.35)}
.ans.bad{background:linear-gradient(180deg,#DC4A30 0%,#B8321B 100%);color:#FFFFFF;box-shadow:0 6px 0 #8A2614,0 12px 28px rgba(210,60,34,.35)}
.ans.dim{opacity:.45}
@keyframes yzshim{0%{background-position:-200px 0}100%{background-position:200px 0}}
.ans.wait{background:linear-gradient(90deg,#FBF4E8 0%,#FFFFFF 50%,#FBF4E8 100%);background-size:400px 100%;animation:yzshim 1.4s linear infinite}
.mk{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.reel{width:30px;height:30px;border-radius:15px;background:radial-gradient(circle,#FFC93C 0 5px,#FFF3D1 6px 100%);box-shadow:0 0 10px rgba(255,201,60,.6)}
.btnY{min-height:58px;border:0;border-radius:20px;background:linear-gradient(180deg,#FFE07A 0%,#FFC93C 50%,#FFAE2E 100%);color:#2B2118;font:inherit;font-size:17px;font-weight:800;box-shadow:0 6px 0 #D99418,0 12px 26px rgba(255,170,46,.4),inset 0 2px 0 rgba(255,255,255,.6);width:100%}
.lnk{min-height:48px;border:0;background:transparent;color:#2B2118;font:inherit;font-size:15px;font-weight:600;text-decoration:underline;width:100%}
</style>
</helmet>
<div style="width: 840px; height: 900px; box-sizing: border-box; padding: 32px 40px 40px; display: flex; gap: 40px; background: radial-gradient(50% 40% at 90% 5%, rgba(255,217,94,.45) 0%, rgba(255,217,94,0) 70%), linear-gradient(160deg, #E2F3EF 0%, #BFE0D9 100%)">
<sc-for list="{{langs}}" as="L" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="cap">{{L.cap}}</div>
<div class="ph {{L.code}}" lang="{{L.code}}">
<div class="sun" style="flex: none; border-radius: 0 0 44px 44px; box-shadow: 0 14px 30px rgba(255,176,46,.35); position: relative; z-index: 1; padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 52px; display: flex; align-items: center; gap: 10px">
<button class="sq" aria-label="{{L.leave}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="flex: 1; text-align: center; font-family: 'Poppins', sans-serif; font-weight: 700">4 / 10</span>
<span style="font-weight: 800; font-size: 14px">{{L.score}}</span>
</div>
<div style="display: flex; justify-content: center; gap: 8px"><span class="chip" style="background: #F0563A">{{L.era}}</span><span class="chip" style="background: #FFFFFF">{{L.diff}}</span></div>
<div aria-hidden="true" style="align-self: center; width: 200px; height: 128px; border-radius: 18px; background: linear-gradient(180deg, #4A3B2E 0%, #2B2118 100%); padding: 9px 9px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 0 0 8px rgba(255,255,255,.3), 0 0 46px rgba(240,86,58,.45)">
<div style="flex: 1; border-radius: 10px; background: linear-gradient(180deg, #FF8A5C 0%, #E0452A 100%); display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 5px 9px; box-shadow: inset 0 8px 12px rgba(255,255,255,.25)">
<div style="height: 5px; border-radius: 3px; background: linear-gradient(90deg, #FFC93C, #FFE07A)"></div>
<div style="height: 42px; border-radius: 21px; background: #2B2118; display: flex; align-items: center; justify-content: space-between; padding: 0 6px"><span class="reel"></span><span style="flex: 1; height: 12px; margin: 0 6px; border-radius: 3px; background: linear-gradient(180deg, #5A4636, #3B2F25)"></span><span class="reel"></span></div>
</div>
<div style="height: 16px; margin: 0 32px; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, #5A4636, #3B2F25)"></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.55); overflow: hidden"><div style="height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2A8A77, #7FB5A8); width: {{L.bar}}"></div></div>
<sc-if value="{{L.time}}" hint-placeholder-val="{{ true }}"><span style="background: #FFFFFF; border-radius: 12px; padding: 3px 10px; font-weight: 700; font-size: 13px; box-shadow: 0 3px 0 rgba(0,0,0,.1)">{{L.time}}</span></sc-if>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; padding: 26px 16px 16px; margin-top: -12px; gap: 12px; background: linear-gradient(180deg, #FFF3D1 0%, #FFFFFF 140px, #FFFFFF 75%, #F3FAF8 100%)">
<div role="status" aria-busy="{{L.busy}}" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
<span style="font-size: {{L.headSize}}; font-weight: 800; line-height: 1.35; color: {{L.headColor}}">{{L.head}}</span>
<sc-if value="{{L.sub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; color: #4A3B2E">{{L.sub}}</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{L.answers}}" as="a" hint-placeholder-count="4">
<button class="ans {{a.cls}}" aria-label="{{a.label}}"><span>{{a.text}}</span>
<sc-if value="{{a.ok}}" hint-placeholder-val="{{ false }}"><span class="mk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{a.mark}}</span></sc-if>
<sc-if value="{{a.bad}}" hint-placeholder-val="{{ false }}"><span class="mk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>{{a.mark}}</span></sc-if>
</button>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; justify-content: center; align-items: center; min-height: 64px">
<sc-if value="{{L.hintBtn}}" hint-placeholder-val="{{ true }}"><button class="sq" style="width: auto; height: 56px; padding: 0 18px 0 14px; gap: 8px; border-radius: 18px; font: inherit; font-weight: 700; font-size: 14px; box-shadow: 0 5px 0 #EDE3D2, 0 8px 20px rgba(43,33,24,.08)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0012 3z"></path></svg>{{L.hint}}</button></sc-if>
<sc-if value="{{L.tap}}" hint-placeholder-val="{{ false }}"><button class="lnk">{{L.tap}}</button></sc-if>
</div>
</div>
<sc-if value="{{L.sheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 5; background: rgba(43,33,24,.45); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-modal="true" aria-label="{{L.sheetTitle}}" style="background: linear-gradient(180deg, #FFF3D1 0%, #FFFFFF 40%); border-radius: 32px 32px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #E3C9A0; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 19px; font-weight: 800">{{L.sheetTitle}}</span><span style="background: #FFC93C; border-radius: 10px; padding: 2px 10px; font-weight: 700; font-size: 13px; flex: none">{{L.closes}}</span></div>
<div style="font-size: 15px; color: #4A3B2E">{{L.terms}}</div>
<div style="display: flex; gap: 10px; align-items: center; background: #FBF4E8; border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M10 9v6M14 9v6"></path></svg><span>{{L.pauseNote}}</span></div>
<button class="btnY">{{L.watch}}</button>
<button class="lnk">{{L.no}}</button>
</div>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["play","correct","wrong","hint","loading"],"default":"play"},"$preview":{"width":840,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const v = this.props.variant || 'play';
const AR = { en: ['Mahmoud Ahmed', 'Tilahun Gessesse', 'Aster Aweke', 'Muluken Melesse'], am: ['ማሕሙድ አሕመድ', 'ጥላሁን ገሠሠ', 'አስቴር አወቀ', 'ሙሉቀን መለሰ'] };
const S = {
  en: { lang: 'English', leave: 'Leave game', pts: ' pts', era: "The '80s", diff: 'Easy · 10 s', sec: ' s', q: 'Who sings this?', hint: 'Hint', correct: 'Correct', yourPick: 'Your pick', notThis: 'Not this one', was: 'It was Ere Mela Mela · Mahmoud Ahmed', speed: 'Speed bonus +43', tap: 'Tap to continue · 5 s', sheetTitle: 'Hint: remove 2 answers', terms: "Watch a short ad. This round's points are halved.", pauseNote: 'The timer pauses for up to 8 seconds while you decide, and while the ad plays.', watch: 'Watch ad', no: 'No thanks', paused: 'Paused', loading: 'Getting the next song…', loadingNote: "If it doesn't load in 10 seconds, we'll skip this round. You won't lose points." },
  am: { lang: 'Amharic', leave: 'ከጨዋታው ይውጡ', pts: ' ነጥብ', era: 'የ80ዎቹ', diff: 'ቀላል · 10 ሰከንድ', sec: ' ሰከንድ', q: 'ይህን ዘፈን የዘፈነው ማን ነው?', hint: 'ፍንጭ', correct: 'ትክክል', yourPick: 'የእርስዎ ምርጫ', notThis: 'ይህ አይደለም', was: 'መልሱ፦ እረ መላ መላ · ማሕሙድ አሕመድ', speed: 'የፍጥነት ጉርሻ +43', tap: 'ለመቀጠል ይንኩ · 5 ሰከንድ', sheetTitle: 'ፍንጭ፦ 2 መልሶችን ያስወግዱ', terms: 'አጭር ማስታወቂያ ይመልከቱ። የዚህ ዙር ነጥብ በግማሽ ይቀንሳል።', pauseNote: 'ለመወሰን እስከ 8 ሰከንድ፣ እንዲሁም ማስታወቂያው እስኪያልቅ ድረስ ሰዓቱ ይቆማል።', watch: 'ማስታወቂያ ይመልከቱ', no: 'አይ፣ ይቅር', paused: 'ቆሟል', loading: 'ቀጣዩን ዘፈን በማዘጋጀት ላይ…', loadingNote: 'በ10 ሰከንድ ውስጥ ካልተጫነ ይህን ዙር እንዘልለዋለን። ነጥብ አይቀነስብዎትም።' }
};
const CAP = { play: 'clip playing', correct: 'correct · shown 1 s', wrong: 'wrong · shown 5 s, tap skips', hint: 'hint sheet · closes after 8 s', loading: 'next song loading · 10 s max' };
const make = (l) => {
  const s = S[l];
  const fb = v === 'correct' || v === 'wrong';
  const answers = AR[l].map((t, i) => {
    const ok = fb && i === 0, bad = v === 'wrong' && i === 1;
    return { text: v === 'loading' ? '' : t, label: (l === 'am' ? 'መልስ ' : 'Answer ') + (i + 1) + ': ' + t, cls: v === 'loading' ? 'wait' : (fb ? (ok ? 'ok' : (bad ? 'bad' : 'dim')) : ''), ok: ok, bad: bad, mark: ok ? s.correct : (bad ? s.yourPick : '') };
  });
  const r = { code: l, cap: s.lang + ' · ' + CAP[v], leave: s.leave, era: s.era, diff: s.diff, answers: answers, hint: s.hint, sheetTitle: s.sheetTitle, terms: s.terms, pauseNote: s.pauseNote, watch: s.watch, no: s.no, closes: '8' + s.sec,
    score: (v === 'correct' ? '563' : '420') + s.pts, bar: v === 'correct' ? '87%' : (v === 'wrong' ? '60%' : '73%'), time: v === 'hint' ? s.paused : (v === 'correct' ? '13' : (v === 'wrong' ? '9' : '7')) + s.sec,
    head: s.q, headSize: '20px', headColor: '#2B2118', sub: '', hintBtn: v === 'play', tap: '', sheet: v === 'hint', busy: v === 'loading' ? 'true' : 'false' };
  if (v === 'play') r.bar = '47%';
  if (v === 'correct') { r.head = s.correct + ' +143'; r.headSize = '24px'; r.headColor = '#1D6658'; r.sub = s.speed; }
  if (v === 'wrong') { r.head = s.notThis; r.headSize = '24px'; r.headColor = '#B8321B'; r.sub = s.was; r.tap = s.tap; }
  if (v === 'loading') { r.head = s.loading; r.headSize = '20px'; r.sub = s.loadingNote; r.bar = '100%'; r.time = ''; r.score = '420' + s.pts; }
  return r;
};
return { langs: [make('en'), make('am')] };
}
}
</script>
</body>
</html>
