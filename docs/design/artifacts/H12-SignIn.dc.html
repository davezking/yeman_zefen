<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi-fi: sign-in sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cap{font:600 12px/20px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#33433F}
.ph{position:relative;width:360px;height:780px;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(43,33,24,.16);font-family:'Poppins','Noto Sans Ethiopic',sans-serif;color:#2B2118;font-size:15px;line-height:1.4;background:radial-gradient(70% 40% at 50% 20%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#FFDF6E 0%,#FFC93C 55%,#FFB02E 100%)}
.ph.am{font-family:'Noto Sans Ethiopic','Poppins',sans-serif;line-height:1.5}
.sso{min-height:54px;border:0;border-radius:18px;font:inherit;font-size:15px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;color:#2B2118;background:linear-gradient(180deg,#FFFFFF 0%,#FBF4E8 100%);box-shadow:0 5px 0 #EDE3D2,0 10px 20px rgba(43,33,24,.08)}
.sso.dark{background:linear-gradient(180deg,#2E2620 0%,#111111 100%);color:#FFFFFF;box-shadow:0 5px 0 #000000}
.lg{width:20px;height:20px;border-radius:6px;background:#E3C9A0;flex:none}
.sso.dark .lg{background:#FFFFFF}
.lnk{min-height:48px;border:0;background:transparent;color:#2B2118;font:inherit;font-size:15px;font-weight:600;text-decoration:underline;width:100%}
</style>
</helmet>
<div style="width: 840px; height: 900px; box-sizing: border-box; padding: 32px 40px 40px; display: flex; gap: 40px; background: radial-gradient(50% 40% at 90% 5%, rgba(255,217,94,.45) 0%, rgba(255,217,94,0) 70%), linear-gradient(160deg, #E2F3EF 0%, #BFE0D9 100%)">
<sc-for list="{{langs}}" as="L" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="cap">{{L.cap}}</div>
<div class="ph {{L.code}}" lang="{{L.code}}">
<div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 44px 20px">
<div style="font-size: 14px; font-weight: 700; color: #4A3B2E">{{L.under1}}</div>
<div style="font-family: 'Poppins', sans-serif; font-size: 48px; font-weight: 800">1,240</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(43,33,24,.4); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-modal="true" aria-label="{{L.title}}" style="background: linear-gradient(180deg, #FFF3D1 0%, #FFFFFF 35%); border-radius: 32px 32px 0 0; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #E3C9A0; align-self: center"></div>
<div style="display: flex; gap: 12px; align-items: center"><span style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(180deg, #FFDF6E, #FFB02E); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #D99418; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"></path></svg></span><span style="font-size: 22px; font-weight: 800; line-height: 1.3">{{L.title}}</span></div>
<div style="font-size: 15px; color: #4A3B2E">{{L.body}}</div>
<div style="display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: #1D6658"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{L.carry}}</div>
<button class="sso dark"><span class="lg"></span>{{L.apple}}</button>
<button class="sso"><span class="lg"></span>{{L.google}}</button>
<button class="sso"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 7l9 6 9-6"></path></svg>{{L.email}}</button>
<button class="lnk">{{L.notNow}}</button>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { langs: [
{ code: 'en', cap: 'English · iOS · after the 5th game', under1: 'Game complete', title: 'Keep your scores', body: 'Sign in to keep your progress on any phone and join the global leaderboard.', carry: 'Your scores so far come with you.', apple: 'Continue with Apple', google: 'Continue with Google', email: 'Continue with email', notNow: 'Not now' },
{ code: 'am', cap: 'Amharic · iOS · after the 5th game', under1: 'ጨዋታው ተጠናቋል', title: 'ውጤቶችዎን ያስቀምጡ', body: 'እድገትዎን በማንኛውም ስልክ ለማቆየትና በዓለም አቀፉ የደረጃ ሰንጠረዥ ለመሳተፍ ይግቡ።', carry: 'እስካሁን ያገኙት ውጤት አይጠፋም።', apple: 'በApple ይቀጥሉ', google: 'በGoogle ይቀጥሉ', email: 'በኢሜይል ይቀጥሉ', notNow: 'አሁን አይደለም' }
] };
}
}
</script>
</body>
</html>
