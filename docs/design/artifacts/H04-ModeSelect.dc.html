<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi-fi: mode select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cap{font:600 12px/20px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#33433F}
.ph{position:relative;width:360px;height:780px;border-radius:40px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(43,33,24,.16);font-family:'Poppins','Noto Sans Ethiopic',sans-serif;color:#2B2118;font-size:15px;line-height:1.4}
.ph.am{font-family:'Noto Sans Ethiopic','Poppins',sans-serif;line-height:1.55}
.sun{background:radial-gradient(70% 55% at 50% 62%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#FFDF6E 0%,#FFC93C 55%,#FFB02E 100%)}
.sq{width:48px;height:48px;border-radius:16px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#2B2118;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:none}
.mode{border:0;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#FFFFFF 0%,#FBF4E8 100%);box-shadow:0 6px 0 #EDE3D2,0 12px 26px rgba(43,33,24,.08);font:inherit;color:#2B2118;text-align:left;width:100%}
.mode.on{background:linear-gradient(180deg,#2E3D39 0%,#2B2118 100%);color:#FFF3D1;box-shadow:0 6px 0 #120D09,0 12px 26px rgba(43,33,24,.25)}
.ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 10px 12px rgba(255,255,255,.38)}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:#FFC93C;color:#2B2118}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#FBF4E8;border-radius:18px;padding:6px}
.seg button{min-height:48px;border:0;border-radius:14px;background:transparent;font:inherit;font-size:15px;font-weight:700;color:#4A3B2E}
.seg button.on{background:#FFFFFF;color:#2B2118;box-shadow:0 4px 0 #EDE3D2}
.btnY{min-height:58px;border:0;border-radius:20px;background:linear-gradient(180deg,#FFE07A 0%,#FFC93C 50%,#FFAE2E 100%);color:#2B2118;font:inherit;font-size:17px;font-weight:800;box-shadow:0 6px 0 #D99418,0 12px 26px rgba(255,170,46,.4),inset 0 2px 0 rgba(255,255,255,.6);width:100%}
</style>
</helmet>
<div style="width: 840px; height: 900px; box-sizing: border-box; padding: 32px 40px 40px; display: flex; gap: 40px; background: radial-gradient(50% 40% at 90% 5%, rgba(255,217,94,.45) 0%, rgba(255,217,94,0) 70%), linear-gradient(160deg, #E2F3EF 0%, #BFE0D9 100%)">
<sc-for list="{{langs}}" as="L" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="cap">{{L.cap}}</div>
<div class="ph {{L.code}}" lang="{{L.code}}">
<div class="sun" style="flex: none; border-radius: 0 0 44px 44px; box-shadow: 0 14px 30px rgba(255,176,46,.35); position: relative; z-index: 1; padding: 14px 18px 26px; display: flex; flex-direction: column; gap: 14px">
<button class="sq" aria-label="{{L.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-size: 25px; font-weight: 800; line-height: 1.35">{{L.title}}</h1>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 28px 18px 22px; margin-top: -12px; background: linear-gradient(180deg, #FFF3D1 0%, #FFFFFF 140px)">
<sc-for list="{{L.modes}}" as="m" hint-placeholder-count="3">
<button class="mode {{m.on}}"><span class="ic" style="background: {{m.color}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2" aria-hidden="true"><path d="{{m.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 16px; font-weight: 800">{{m.name}}</span><sc-if value="{{m.tag}}" hint-placeholder-val="{{ true }}"><span class="tag">{{m.tag}}</span></sc-if></span><span style="font-size: 13px; opacity: .85">{{m.desc}}</span></span></button>
</sc-for>
<div style="font-size: 14px; font-weight: 800; margin-top: 4px">{{L.guess}}</div>
<div class="seg" role="group"><button class="on">{{L.song}}</button><button>{{L.artist}}</button></div>
<div style="margin-top: auto"><button class="btnY">{{L.next}}</button></div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const I = { intro: 'M9 18V5l12-2v13M6 21a3 3 0 100-6 3 3 0 000 6zM18 19a3 3 0 100-6 3 3 0 000 6z', mid: 'M3 12h3l3-8 4 16 3-8h5', era: 'M12 7v5l3 2M12 21a9 9 0 100-18 9 9 0 000 18z' };
return { langs: [
{ code: 'en', cap: 'English · Intro selected', back: 'Back', title: 'How do you want to play?', guess: 'Guess the', song: 'Song', artist: 'Artist', next: 'Next',
  modes: [ { name: 'Guess the Intro', desc: 'The opening of the song. The classic.', tag: '', on: 'on', color: '#FFC93C', icon: I.intro }, { name: 'Guess from the Middle', desc: "A clip from the middle. Harder, so it's worth more.", tag: '+25%', on: '', color: '#F0563A', icon: I.mid }, { name: 'Which Era?', desc: 'Hear a song and name its generation.', tag: 'Bonus', on: '', color: '#7FB5A8', icon: I.era } ] },
{ code: 'am', cap: 'Amharic · Intro selected', back: 'ይመለሱ', title: 'እንዴት መጫወት ይፈልጋሉ?', guess: 'የሚገምቱት', song: 'ዘፈኑን', artist: 'ዘፋኙን', next: 'ቀጣይ',
  modes: [ { name: 'መግቢያውን ይገምቱ', desc: 'የዘፈኑ መጀመሪያ። የተለመደው ጨዋታ።', tag: '', on: 'on', color: '#FFC93C', icon: I.intro }, { name: 'ከመሀል ይገምቱ', desc: 'ከዘፈኑ መሀል የተወሰደ ቅንጭብ። ስለሚከብድ ተጨማሪ ነጥብ ያስገኛል።', tag: '+25%', on: '', color: '#F0563A', icon: I.mid }, { name: 'የየትኛው ዘመን?', desc: 'ዘፈኑን ሰምተው ዘመኑን ይለዩ።', tag: 'ተጨማሪ', on: '', color: '#7FB5A8', icon: I.era } ] }
] };
}
}
</script>
</body>
</html>
