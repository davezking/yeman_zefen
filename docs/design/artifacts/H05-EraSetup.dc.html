<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi-fi: era, genre and difficulty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cap{font:600 12px/20px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#33433F}
.ph{position:relative;width:360px;height:780px;border-radius:40px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(43,33,24,.16);font-family:'Poppins','Noto Sans Ethiopic',sans-serif;color:#2B2118;font-size:15px;line-height:1.4}
.ph.am{font-family:'Noto Sans Ethiopic','Poppins',sans-serif;line-height:1.5}
.sun{background:radial-gradient(70% 55% at 50% 62%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#FFDF6E 0%,#FFC93C 55%,#FFB02E 100%)}
.sq{width:48px;height:48px;border-radius:16px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#2B2118;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.1);flex:none}
.lab{font-size:14px;font-weight:800}
.era{min-height:52px;border:0;border-radius:16px;font:inherit;color:#2B2118;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.12),inset 0 12px 14px rgba(255,255,255,.38)}
.era.on{outline:3px solid #2B2118;outline-offset:2px}
.chip{min-height:44px;border-radius:14px;border:0;font:inherit;font-size:13px;font-weight:700;padding:0 14px;color:#2B2118;background:linear-gradient(180deg,#FFFFFF 0%,#FBF4E8 100%);box-shadow:0 4px 0 #EDE3D2}
.chip.on{background:#2B2118;color:#FFC93C;box-shadow:0 4px 0 #120D09}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#FBF4E8;border-radius:18px;padding:6px}
.seg button{min-height:48px;border:0;border-radius:14px;background:transparent;font:inherit;font-size:13px;font-weight:700;color:#4A3B2E;padding:2px}
.seg button.on{background:#FFFFFF;color:#2B2118;box-shadow:0 4px 0 #EDE3D2}
.btnY{min-height:58px;border:0;border-radius:20px;background:linear-gradient(180deg,#FFE07A 0%,#FFC93C 50%,#FFAE2E 100%);color:#2B2118;font:inherit;font-size:17px;font-weight:800;box-shadow:0 6px 0 #D99418,0 12px 26px rgba(255,170,46,.4),inset 0 2px 0 rgba(255,255,255,.6);width:100%}
</style>
</helmet>
<div style="width: 840px; height: 900px; box-sizing: border-box; padding: 32px 40px 40px; display: flex; gap: 40px; background: radial-gradient(50% 40% at 90% 5%, rgba(255,217,94,.45) 0%, rgba(255,217,94,0) 70%), linear-gradient(160deg, #E2F3EF 0%, #BFE0D9 100%)">
<sc-for list="{{langs}}" as="L" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="cap">{{L.cap}}</div>
<div class="ph {{L.code}}" lang="{{L.code}}">
<div class="sun" style="flex: none; border-radius: 0 0 40px 40px; box-shadow: 0 14px 30px rgba(255,176,46,.35); position: relative; z-index: 1; padding: 12px 18px 20px; display: flex; align-items: center; gap: 12px">
<button class="sq" aria-label="{{L.back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 18px; font-weight: 800">{{L.mode}}</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 24px 18px 20px; margin-top: -12px; background: linear-gradient(180deg, #FFF3D1 0%, #FFFFFF 140px)">
<div class="lab">{{L.eraTitle}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{L.eras}}" as="e" hint-placeholder-count="6">
<button class="era {{e.on}}" style="background: {{e.color}}"><span style="font-size: 14px; font-weight: 800">{{e.name}}</span><sc-if value="{{e.sub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600">{{e.sub}}</span></sc-if></button>
</sc-for>
</div>
<div class="lab" style="margin-top: 4px">{{L.genreTitle}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{L.genres}}" as="g" hint-placeholder-count="6"><button class="chip {{g.on}}">{{g.name}}</button></sc-for>
</div>
<div class="lab" style="margin-top: 4px">{{L.diffTitle}}</div>
<div class="seg" role="group"><button class="on">{{L.easy}}</button><button>{{L.medium}}</button><button>{{L.hard}}</button></div>
<div style="margin-top: auto"><button class="btnY">{{L.start}}</button></div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const C = ['#FFFFFF', '#FFC93C', '#F0563A', '#7FB5A8', '#E3C9A0', '#C9B8EC'];
const eras = (names, subs, sel) => names.map((n, i) => ({ name: n, sub: subs[i], color: i === 0 ? 'linear-gradient(180deg,#FFFFFF,#FBF4E8)' : C[i], on: i === sel ? 'on' : '' }));
const genres = (xs) => xs.map((n, i) => ({ name: n, on: i === 0 ? 'on' : '' }));
return { langs: [
{ code: 'en', cap: "English · '80s selected", back: 'Back', mode: 'Guess the Intro', eraTitle: 'Pick an era', genreTitle: 'Genre (optional)', diffTitle: 'Clip length', easy: 'Easy · 10 s', medium: 'Medium · 5 s', hard: 'Hard · 3 s', start: 'Start · 10 rounds',
  eras: eras(['All eras', 'Golden Age', "The '80s", "The '90s", 'The 2000s', 'Modern'], ['', 'Before 1980', '', '', '', '2010 and later'], 2),
  genres: genres(['Any genre', 'Tizita', 'Ethio-jazz', 'Traditional', 'Pop', 'Hip-hop']) },
{ code: 'am', cap: 'Amharic · የ80ዎቹ selected', back: 'ይመለሱ', mode: 'መግቢያውን ይገምቱ', eraTitle: 'ዘመን ይምረጡ', genreTitle: 'ዘውግ (አማራጭ)', diffTitle: 'የቅንጭቡ ርዝመት', easy: 'ቀላል · 10 ሰከንድ', medium: 'መካከለኛ · 5 ሰከንድ', hard: 'ከባድ · 3 ሰከንድ', start: 'ይጀምሩ · 10 ዙሮች',
  eras: eras(['ሁሉም ዘመኖች', 'ወርቃማው ዘመን', 'የ80ዎቹ', 'የ90ዎቹ', 'የ2000ዎቹ', 'ዘመናዊ'], ['', 'ከ1980 በፊት', '', '', '', 'ከ2010 ወዲህ'], 2),
  genres: genres(['ማንኛውም ዘውግ', 'ትዝታ', 'ኢትዮ-ጃዝ', 'ባህላዊ', 'ፖፕ', 'ሂፕ-ሆፕ']) }
] };
}
}
</script>
</body>
</html>
