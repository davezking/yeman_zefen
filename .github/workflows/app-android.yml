# Release build of the prod Android app: a signed, obfuscated AAB for Google Play, and an APK of the same build
# to install by hand (beta testers, a phone you hold).
#
#   git tag app-v0.2.0 && git push origin app-v0.2.0
#
# The tag's version (without a -rc1 style suffix) must equal the name in app/pubspec.yaml, which is the
# single source of the version. The build number (Android versionCode) is the run number of this workflow,
# so it only ever goes up.
#
# Everything secret lives in the `release` environment (Settings > Environments), so only this job can read
# it, and a required reviewer there gates every release. One-time setup, the secrets and the checks:
# docs/release-android.md.
name: app-android

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Android release (signed AAB)
    runs-on: ubuntu-latest
    environment: release
    # Two builds (AAB, then APK); the second reuses Gradle's outputs.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        env:
          # A repository variable (not a secret). Raise it when versionCodes were used outside this workflow.
          BUILD_NUMBER_OFFSET: ${{ vars.ANDROID_BUILD_NUMBER_OFFSET || '0' }}
        run: |
          set -euo pipefail
          tag_version=${GITHUB_REF_NAME#app-v}
          tag_version=${tag_version%%-*}
          pubspec_version=$(sed -n 's/^version: *\([^+ ]*\)+.*/\1/p' pubspec.yaml)
          if [ -z "$pubspec_version" ] || [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is version '$tag_version' but app/pubspec.yaml says '$pubspec_version'. Update pubspec.yaml, merge, and tag again."
            exit 1
          fi
          echo "name=$pubspec_version" >> "$GITHUB_OUTPUT"
          echo "number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Stops a build that would ship a placeholder API domain or Google's sample AdMob id with real ad units.
      - run: tool/check_release_config.sh android

      # Bundles the published `starter` pack, so a first launch plays with no network (docs/ops.md, "Starter
      # clips"). Clips already committed are replaced by the current pack. With no starter pack published the
      # build goes on with what is committed, and says so; any other failure (network, checksum) stops it.
      - name: Bundle the starter pack
        run: |
          set -uo pipefail
          api_base=$(jq -r '.API_BASE' config/prod.json)
          if output=$(dart run tool/fetch_starter_pack.dart --api-base "$api_base" 2>&1); then
            echo "$output"
          elif grep -q 'no published pack' <<< "$output"; then
            echo "$output"
            echo "::warning::No starter pack is published (slug 'starter' in the admin site, docs/ops.md \"Starter clips\"). The build keeps the clips committed in app/assets/starter/, if any."
          else
            echo "$output"
            echo "::error::Fetching the starter pack failed. Fix it and tag again."
            exit 1
          fi

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret ANDROID_${name/STORE_PASSWORD/KEYSTORE_PASSWORD} is not set in the release environment (docs/release-android.md)."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          # Fails here, with a clear message, on bad base64, a wrong password or a wrong alias.
          keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          umask 077
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # --obfuscate with --split-debug-info hides Dart symbol names; the symbols stay in build/symbols and
      # go to Crashlytics below. R8 shrinks and obfuscates the Java side, and the Crashlytics Gradle plugin
      # uploads its mapping file during this build (prod release only, app/android/app/build.gradle.kts).
      - name: Build the AAB
        run: >
          flutter build appbundle --release --flavor prod
          --dart-define-from-file=config/prod.json
          --obfuscate --split-debug-info=build/symbols
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Check the signature
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          # Captured first: jarsigner prints warnings after "jar verified." for a self-signed upload key, and
          # piping it into `grep -q` would end in SIGPIPE under pipefail.
          verify=$(jarsigner -verify "$aab")
          echo "$verify"
          if ! grep -q "jar verified" <<< "$verify"; then
            echo "::error::The AAB is not signed."
            exit 1
          fi
          # keytool indents these lines with a tab and a space.
          fingerprint=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not read the AAB's signing certificate."
            exit 1
          fi
          {
            echo "### Android release ${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }})"
            echo "Signing certificate SHA-256: \`$fingerprint\`"
            echo "It must match the upload certificate in Play Console (App integrity > App signing > Upload key certificate)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The same app as an APK, to install directly (Play only takes the AAB). It is signed with the same upload key.
      # Its own symbols folder: the Dart symbols belong to one exact build, so each build is uploaded with its own.
      - name: Build the APK
        run: >
          flutter build apk --release --flavor prod
          --dart-define-from-file=config/prod.json
          --obfuscate --split-debug-info=build/symbols-apk
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      # The Dart symbols of both obfuscated builds. Without them, Dart stack traces in Crashlytics are unreadable.
      - name: Upload Dart symbols to Crashlytics
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::The secret FIREBASE_SERVICE_ACCOUNT_JSON is not set in the release environment (docs/release-android.md)."
            exit 1
          fi
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials"
          app_id=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.yemanzefen.yeman_zefen") | .client_info.mobilesdk_app_id' android/app/src/prod/google-services.json)
          for dir in build/symbols build/symbols-apk; do
            GOOGLE_APPLICATION_CREDENTIALS="$credentials" npx --yes firebase-tools@15 crashlytics:symbols:upload --app="$app_id" "$dir"
          done

      - name: Zip the symbols
        run: cd build && zip -qr symbols.zip symbols symbols-apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.number }}
          path: |
            app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
            app/build/app/outputs/flutter-apk/app-prod-release.apk
            app/build/app/outputs/mapping/prodRelease/mapping.txt
            app/build/symbols.zip
          if-no-files-found: error
          retention-days: 90

      # Optional: to Play's internal testing track. Off until the app exists in Play Console and its first
      # AAB was uploaded by hand (docs/release-android.md). Turn on with the repository variable PLAY_UPLOAD=true.
      # The action is third-party and gets the Play service account: pin it to a commit once you rely on it.
      - name: Upload to Play (internal track)
        if: vars.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yemanzefen.yeman_zefen
          releaseFiles: app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          mappingFile: app/build/app/outputs/mapping/prodRelease/mapping.txt
          track: internal
          status: completed

      - name: Remove the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/firebase-service-account.json"
